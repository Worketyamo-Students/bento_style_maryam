<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <title>Bento_W&Y</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Hebrew:wght@100;200;300;400;500;600;700&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Montaga&family=Open+Sans:ital,wght@0,300..800;1,300..800&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap');
    </style>
    <style type="text/tailwindcss">
        @theme {
        --color-body: #161616;
        --color-grid: #1B1B1B;
        --color-bordure: #262626;
        --color-texte: #F35034;
        --color-contentext: #C0C0C0;
        --color-hover: oklch(64.6% 0.222 41.116);
        --font-nav:'Inter';
        --color-btn:#E63E21;
        --color-borderbtn:#E4643F;


      }
    </style>
</head>

<body class="bg-body">
    <!-- Affichage mobile -->
    <div class="mx-13 py-13 flex justify-center items-center gap-2">
        <div class=" border-2 border-bordure rounded-4xl w-[49.3px] h-12 relative bg-grid">
            <a href="#">
                <img src="images/Vector (1).png" alt="logo"
                    class="absolute top-2 left-[8.2px] sm:top-2  sm:left-[8.7px]">
            </a>
        </div>
        <div
            class="border-2 border-bordure flex justify-between bg-grid w-[283px] sm:w-[1152px] h-[44px] sm:h-[64px] rounded-4xl items-center">
            <a href="#about">
                <li class="hover:text-hover active:text-texte ml-10 sm:ml-20 mr-28 text-white list-none font-nav">ABOUT
                </li>
            </a>
            <ul class="hidden sm:flex gap-[26rem] items-center ml-10 text-white  font-nav">
                <a href="#">
                    <li class="hover:text-hover active:text-texte ml-24">PORTFOLIO</li>
                </a>
                <a href="#">
                    <li class="hover:text-hover active:text-texte ">CONTACT</li>
            </ul>
            </a>
            <img src="images/mi_menu.png" alt="menu" class="sm:hidden mr-4">
        </div>
    </div>
    <!--about section -->
    <section id="about"
        class=" border-2 border-bordure bg-grid rounded-xl mx-17 p-9  h-[389px] sm:h-[408.01px] sm:w-[1215px]">
        <div class=" flex flex-col-reverse sm:flex-row justify-between">
            <p class="text-contentext text-[16px] sm:text-[24px] font-nav pt-4 sm:pt-0">UI/UX Designer</p>
            <div
                class="border-2 border-bordure text-[13px] text-contentext  flex justify-center items-center bg-body border-1 border-bordure rounded-4xl gap-2 h-[26px] w-[181px]">
                <div class="bg-texte rounded-4xl w-2 h-2"> </div>
                AVAILABLE FOR JOB
            </div>
        </div>
        <div class="flex flex-col-reverse sm:flex-row sm:gap-[30rem] sm:mt-3">
            <div class="w-[288px] sm:w-[288px]  h-[91px] sm:h-[119px] mt-7">
                <h1 class=" text-[24px] sm:text-[36px] text-white font-semibold font-nav">I’m Mar'yam Mfopit</h1>
                <p class="text-[16px] sm:text-[20px] text-contentext font-nav"> design digital products with <br> great
                    experience.</p>

                <div class="flex gap-2 mt-5">
                    <div class="flex border-1 border-borderbtn w-[84px] sm:w-[108px]  h-[33px] sm:h-[42.01px] rounded-[7px] bg-btn">
                        <button class="bg-btn backdrop-blur-sm rounded-[7px] w-[59px] sm:w-[79px] text-[11px] sm:text-[16px] text-white font-nav">Hire me</button>
                        <div class="flex items-center justify-center border-1 border-btn border-l-black">
                            <img src="images/Vector (4).png" alt="plus">
                        </div>
                    </div>

                    <div class="flex  border-1 border-bordure  w-[100px] h-[33px] sm:h-[42.01px] sm:w-[143px] rounded-[7px]">
                        <button class="w-[77px] sm:w-[113px] text-[11px] sm:text-[16px] text-white font-nav">Copy Email</button>
                        <div class="flex items-center justifier-center border-1 border-none border-l-bordure">
                            <img src="images/Vector (3).png" alt="copy">
                        </div>
                    </div>

                </div>
            </div>

            <div class="h-[80px] sm:h-[178px] w-[80px] sm:w-[178px] mt-4 sm:mt-0">
                <img src="images/SKYDEV.png" alt="image" class="rounded-full object-cover sm:ml-42 sm:mt-10">
            </div>
        </div>
    </section>
</body>

</html>
